name: Build Android APKs

on:
  push:
    branches:
      - "main"
      - "master"
    paths-ignore:
      - "**.md"

  pull_request:
    branches:
      - "main"
      - "master"
    paths-ignore:
      - "**.md"

  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type to compile (all, debug, release)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  build-debug:
    name: Build Debug APK & Run Tests
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.build_type == 'all' ||
      github.event.inputs.build_type == 'debug'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Verify build toolchain
        run: |
          echo "=== Java ==="
          java -version

          echo
          echo "=== Gradle wrapper ==="
          ./gradlew --version

          echo
          echo "=== Repository Gradle configuration ==="
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

          echo
          echo "=== Kotlin / AGP / KSP versions ==="
          grep -E '^(agp|kotlin|googleDevtoolsKsp) *=' gradle/libs.versions.toml

      - name: Auto-generate Debug Keystore if missing
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from debug.keystore.base64..."
              base64 --decode debug.keystore.base64 > debug.keystore
            fi

            if [ ! -f "debug.keystore" ]; then
              echo "Generating fresh debug keystore..."
              keytool -genkeypair \
                -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Clean build
        run: ./gradlew clean --stacktrace

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zeus-ide-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  build-release:
    name: Build Release APK
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.build_type == 'all' ||
      github.event.inputs.build_type == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Verify build toolchain
        run: |
          echo "=== Java ==="
          java -version

          echo
          echo "=== Gradle wrapper ==="
          ./gradlew --version

          echo
          echo "=== Repository Gradle configuration ==="
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

          echo
          echo "=== Kotlin / AGP / KSP versions ==="
          grep -E '^(agp|kotlin|googleDevtoolsKsp) *=' gradle/libs.versions.toml

      - name: Prepare Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from debug.keystore.base64..."
              base64 --decode debug.keystore.base64 > debug.keystore
            fi

            if [ ! -f "debug.keystore" ]; then
              echo "Generating fresh debug keystore..."
              keytool -genkeypair \
                -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Prepare Release Signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 || secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Using release keystore from GitHub Secret."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          elif [ ! -f "my-upload-key.jks" ]; then
            echo "Generating release upload keystore..."

            keytool -genkeypair \
              -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Zeus Developer, OU=Mobile, O=Zeus, L=San Francisco, ST=CA, C=US"

            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          else
            echo "Using existing my-upload-key.jks."

            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Clean build
        run: ./gradlew clean --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: zeus-ide-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/*/*.apk
          retention-days: 30
          if-no-files-found: error