name: Build Android APKs

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"

  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"

  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build ZeusStudio-IDE
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Java
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ------------------------------------------------------------
      # Determine Gradle version from the repository's wrapper
      # properties.
      #
      # gradle/wrapper/gradle-wrapper.properties is intentionally
      # the source of truth even when gradlew is not committed.
      # ------------------------------------------------------------
      - name: Determine Gradle version
        id: gradle_version
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::gradle/wrapper/gradle-wrapper.properties is missing."
            exit 1
          fi

          DISTRIBUTION_URL="$(
            sed -n 's/^distributionUrl=//p' \
              gradle/wrapper/gradle-wrapper.properties
          )"

          if [ -z "$DISTRIBUTION_URL" ]; then
            echo "::error::distributionUrl is missing from gradle-wrapper.properties."
            exit 1
          fi

          # Decode the escaped '=' used in Gradle's properties file.
          DISTRIBUTION_URL="${DISTRIBUTION_URL//\\=/=}"

          GRADLE_VERSION="$(
            printf '%s\n' "$DISTRIBUTION_URL" |
              sed -n 's/.*gradle-\([0-9][0-9.]*\)-.*/\1/p'
          )"

          if [ -z "$GRADLE_VERSION" ]; then
            echo "::error::Unable to determine Gradle version from distributionUrl."
            echo "distributionUrl=$DISTRIBUTION_URL"
            exit 1
          fi

          echo "Gradle version from wrapper properties: $GRADLE_VERSION"
          echo "gradle_version=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Install the Gradle version specified by the repository.
      #
      # This is only the bootstrap Gradle. Once gradlew is generated,
      # all actual builds use ./gradlew.
      # ------------------------------------------------------------
      - name: Set up bootstrap Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle_version.outputs.gradle_version }}

      # ------------------------------------------------------------
      # Generate the wrapper when it is not committed.
      # ------------------------------------------------------------
      - name: Bootstrap Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper already exists."
          else
            echo "gradlew is missing."
            echo "Generating Gradle wrapper..."

            gradle wrapper \
              --gradle-version "${{ steps.gradle_version.outputs.gradle_version }}"

            if [ ! -f "./gradlew" ]; then
              echo "::error::Gradle wrapper generation failed."
              exit 1
            fi
          fi

          chmod +x ./gradlew

          echo
          echo "=== Gradle wrapper ==="
          ./gradlew --version

      # ------------------------------------------------------------
      # Display the actual project toolchain.
      # This makes future compiler/plugin mismatches immediately
      # visible in the Actions log.
      # ------------------------------------------------------------
      - name: Inspect Android build toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Java ==="
          java -version

          echo
          echo "=== Gradle ==="
          ./gradlew --version

          echo
          echo "=== Gradle wrapper properties ==="
          cat gradle/wrapper/gradle-wrapper.properties

          echo
          echo "=== Version catalog ==="

          if [ -f "gradle/libs.versions.toml" ]; then
            grep -E \
              '^(agp|kotlin|googleDevtoolsKsp|composeBom|androidxComposeBom)[[:space:]]*=' \
              gradle/libs.versions.toml || true
          fi

      # ------------------------------------------------------------
      # Create debug keystore if the project doesn't already have one.
      # ------------------------------------------------------------
      - name: Prepare debug keystore
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "debug.keystore" ]; then
            echo "Using existing debug.keystore."
            exit 0
          fi

          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore.base64..."
            base64 --decode debug.keystore.base64 > debug.keystore
            exit 0
          fi

          echo "Generating debug keystore..."

          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # ------------------------------------------------------------
      # Clean once before compilation.
      # ------------------------------------------------------------
      - name: Clean project
        run: ./gradlew clean --stacktrace

      # ------------------------------------------------------------
      # Unit / Robolectric tests
      # ------------------------------------------------------------
      - name: Run Debug Unit Tests
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.build_type == 'all' ||
          github.event.inputs.build_type == 'debug'
        run: ./gradlew testDebugUnitTest --stacktrace

      # ------------------------------------------------------------
      # Debug APK
      # ------------------------------------------------------------
      - name: Build Debug APK
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.build_type == 'all' ||
          github.event.inputs.build_type == 'debug'
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.build_type == 'all' ||
          github.event.inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: zeus-studio-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      # ------------------------------------------------------------
      # Release signing preparation
      # ------------------------------------------------------------
      - name: Prepare release signing
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.build_type == 'all' ||
          github.event.inputs.build_type == 'release'
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "Using release keystore from GitHub Secret."

            printf '%s' "$RELEASE_KEYSTORE_BASE64" |
              base64 --decode > "$GITHUB_WORKSPACE/release-key.jks"

            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-key.jks" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

          else
            echo "No release keystore secret supplied."

            # Do not silently create a production signing key.
            # The release build will only proceed if the project itself
            # is configured for unsigned/debug-compatible release output.
            echo "RELEASE_SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      # ------------------------------------------------------------
      # Release APK
      # ------------------------------------------------------------
      - name: Build Release APK
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.build_type == 'all' ||
          github.event.inputs.build_type == 'release'
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.build_type == 'all' ||
          github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: zeus-studio-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error