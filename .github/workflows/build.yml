name: Build ZeusStudio-IDE

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build ZeusStudio-IDE
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle


      # ============================================================
      # DETERMINE GRADLE VERSION
      #
      # The repository's gradle-wrapper.properties is the source
      # of truth. We do NOT configure the Android project here.
      # ============================================================

      - name: Determine Gradle version
        id: gradle_version
        shell: bash
        run: |
          set -euo pipefail

          PROPERTIES="gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$PROPERTIES" ]; then
            echo "::error::$PROPERTIES does not exist."
            exit 1
          fi

          echo "=== gradle-wrapper.properties ==="
          cat "$PROPERTIES"

          DISTRIBUTION_URL="$(
            sed -n 's/^distributionUrl=//p' "$PROPERTIES"
          )"

          # Gradle properties files escape '=' characters.
          DISTRIBUTION_URL="${DISTRIBUTION_URL//\\=/=}"

          if [ -z "$DISTRIBUTION_URL" ]; then
            echo "::error::distributionUrl is missing."
            exit 1
          fi

          GRADLE_VERSION="$(
            printf '%s\n' "$DISTRIBUTION_URL" |
              sed -n 's/.*gradle-\([0-9][0-9.]*\)-.*/\1/p'
          )"

          if [ -z "$GRADLE_VERSION" ]; then
            echo "::error::Unable to determine Gradle version."
            echo "URL: $DISTRIBUTION_URL"
            exit 1
          fi

          echo "Gradle version: $GRADLE_VERSION"

          echo "gradle_version=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"


      # ============================================================
      # BOOTSTRAP GRADLE WRAPPER
      #
      # IMPORTANT:
      #
      # We intentionally DO NOT run:
      #
      #   gradle wrapper
      #
      # from the ZeusStudio project.
      #
      # That would configure :app and currently trigger the
      # AGP/Kotlin/KSP problem before the wrapper is generated.
      #
      # Instead, we download Gradle directly and generate the
      # wrapper inside a completely isolated temporary project.
      # ============================================================

      - name: Bootstrap Gradle wrapper
        shell: bash
        env:
          GRADLE_VERSION: ${{ steps.gradle_version.outputs.gradle_version }}
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ] &&
             [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then

            echo "Gradle wrapper already exists."

            chmod +x ./gradlew

            echo
            echo "=== Existing Gradle wrapper ==="
            ./gradlew --version

            exit 0
          fi

          echo "Gradle wrapper is missing."
          echo "Creating wrapper without configuring ZeusStudio..."

          TMP_DIR="$(mktemp -d)"

          trap 'rm -rf "$TMP_DIR"' EXIT

          GRADLE_ZIP="$TMP_DIR/gradle-${GRADLE_VERSION}-bin.zip"
          GRADLE_HOME="$TMP_DIR/gradle-${GRADLE_VERSION}"
          WRAPPER_PROJECT="$TMP_DIR/wrapper-project"

          echo
          echo "Temporary directory:"
          echo "$TMP_DIR"

          # --------------------------------------------------------
          # Download official Gradle binary distribution.
          # --------------------------------------------------------

          echo
          echo "Downloading Gradle ${GRADLE_VERSION}..."

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            --output "$GRADLE_ZIP" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          # --------------------------------------------------------
          # Extract Gradle.
          # --------------------------------------------------------

          echo
          echo "Extracting Gradle..."

          unzip -q "$GRADLE_ZIP" -d "$TMP_DIR"

          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            echo "::error::Downloaded Gradle executable was not found."
            exit 1
          fi

          echo
          echo "=== Bootstrap Gradle ==="
          "$GRADLE_HOME/bin/gradle" --version

          # --------------------------------------------------------
          # Create an isolated Gradle project.
          #
          # This project has NO relationship to ZeusStudio.
          # --------------------------------------------------------

          echo
          echo "Creating isolated wrapper project..."

          mkdir -p "$WRAPPER_PROJECT"

          cat > "$WRAPPER_PROJECT/settings.gradle" <<'EOF'
          rootProject.name = 'zeusstudio-wrapper-bootstrap'
          EOF

          cat > "$WRAPPER_PROJECT/build.gradle" <<'EOF'
          /*
           * This build exists solely to generate the Gradle Wrapper.
           *
           * It intentionally contains no Android plugins,
           * Kotlin plugins, KSP plugins, dependencies,
           * repositories, or references to ZeusStudio.
           */
          EOF

          cd "$WRAPPER_PROJECT"

          # --------------------------------------------------------
          # Generate wrapper.
          # --------------------------------------------------------

          echo
          echo "Generating Gradle wrapper..."

          "$GRADLE_HOME/bin/gradle" wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin \
            --no-daemon \
            --stacktrace

          # --------------------------------------------------------
          # Verify generated files.
          # --------------------------------------------------------

          echo
          echo "=== Generated wrapper ==="

          find . -maxdepth 3 -type f -print

          if [ ! -f "gradlew" ]; then
            echo "::error::gradlew was not generated."
            exit 1
          fi

          if [ ! -f "gradlew.bat" ]; then
            echo "::error::gradlew.bat was not generated."
            exit 1
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::gradle-wrapper.jar was not generated."
            exit 1
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::gradle-wrapper.properties was not generated."
            exit 1
          fi

          # --------------------------------------------------------
          # Copy wrapper into ZeusStudio.
          # --------------------------------------------------------

          echo
          echo "Installing wrapper into ZeusStudio..."

          cp gradlew "$GITHUB_WORKSPACE/gradlew"
          cp gradlew.bat "$GITHUB_WORKSPACE/gradlew.bat"

          mkdir -p "$GITHUB_WORKSPACE/gradle/wrapper"

          cp \
            gradle/wrapper/gradle-wrapper.jar \
            "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.jar"

          chmod +x "$GITHUB_WORKSPACE/gradlew"

          cd "$GITHUB_WORKSPACE"

          echo
          echo "=== ZeusStudio wrapper files ==="

          ls -lh \
            gradlew \
            gradlew.bat \
            gradle/wrapper/gradle-wrapper.jar \
            gradle/wrapper/gradle-wrapper.properties

          # --------------------------------------------------------
          # Verify wrapper WITHOUT running an Android task.
          # --version causes Gradle to start but does not build the
          # Android project.
          # --------------------------------------------------------

          echo
          echo "=== Generated ZeusStudio Gradle wrapper ==="

          ./gradlew --version


      # ============================================================
      # GRADLE ACTIONS
      #
      # At this point the wrapper exists, so setup-gradle can safely
      # configure Gradle caching/CI integration.
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6


      # ============================================================
      # TOOLCHAIN DIAGNOSTICS
      # ============================================================

      - name: Inspect build toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Java"
          echo "========================================"

          java -version

          echo
          echo "========================================"
          echo "Gradle"
          echo "========================================"

          ./gradlew --version

          echo
          echo "========================================"
          echo "Gradle Wrapper Properties"
          echo "========================================"

          cat gradle/wrapper/gradle-wrapper.properties

          echo
          echo "========================================"
          echo "Version Catalog"
          echo "========================================"

          if [ -f "gradle/libs.versions.toml" ]; then
            cat gradle/libs.versions.toml
          fi


      # ============================================================
      # GRADLE PROJECT VALIDATION
      #
      # This is deliberately separate from the wrapper bootstrap.
      # If this fails, we now know the wrapper itself is working.
      # ============================================================

      - name: Validate Gradle project
        run: ./gradlew tasks --stacktrace


      # ============================================================
      # UNIT TESTS
      # ============================================================

      - name: Run Debug Unit Tests
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.build_type == 'all' ||
          github.event.inputs.build_type == 'debug'
        run: |
          ./gradlew testDebugUnitTest \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # DEBUG APK
      # ============================================================

      - name: Build Debug APK
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.build_type == 'all' ||
          github.event.inputs.build_type == 'debug'
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # UPLOAD DEBUG APK
      # ============================================================

      - name: Upload Debug APK
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.build_type == 'all' ||
          github.event.inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: zeus-studio-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error


      # ============================================================
      # RELEASE APK
      #
      # This simply invokes the project's existing release
      # configuration. We do not create or replace signing keys.
      # ============================================================

      - name: Build Release APK
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.build_type == 'all' ||
          github.event.inputs.build_type == 'release'
        run: |
          ./gradlew assembleRelease \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # UPLOAD RELEASE APK
      # ============================================================

      - name: Upload Release APK
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.build_type == 'all' ||
          github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: zeus-studio-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error