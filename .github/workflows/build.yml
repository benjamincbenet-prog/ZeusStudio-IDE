name: Build Android APKs

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type to compile (all, debug, release)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build Debug APK & Run Tests
    if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'debug' || github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Auto-generate Debug Keystore if missing
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
            fi
            if [ ! -f "debug.keystore" ]; then
              echo "Generating fresh debug keystore..."
              keytool -genkey -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zeus-ide-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

  build-release:
    name: Build Release APK
    if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release' || github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Auto-generate Release Keystore & Prepare Signing
        run: |
          # 1. Ensure debug.keystore is present
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
            fi
            if [ ! -f "debug.keystore" ]; then
              echo "Generating fresh debug keystore..."
              keytool -genkey -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 2. Check for custom secret or auto-generate release upload keystore
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding release signing key from GitHub Secret..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD || 'android' }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'android' }}" >> $GITHUB_ENV
          elif [ ! -f "my-upload-key.jks" ]; then
            echo "Auto-generating release upload keystore (my-upload-key.jks)..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${STORE_PASS:-android}" \
              -keypass "${KEY_PASS:-android}" \
              -dname "CN=Zeus Developer, OU=Mobile, O=Zeus, L=San Francisco, ST=CA, C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${STORE_PASS:-android}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASS:-android}" >> $GITHUB_ENV
          else
            echo "Found existing my-upload-key.jks in workspace."
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${STORE_PASS:-android}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASS:-android}" >> $GITHUB_ENV
          fi
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 || secrets.SIGNING_KEY }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'android' }}

      - name: Build Release APK
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease --stacktrace || ./gradlew assemble --stacktrace
          else
            gradle assembleRelease --stacktrace || gradle assemble --stacktrace
          fi
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeus-ide-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/*/*.apk
          retention-days: 30
          if-no-files-found: warn
